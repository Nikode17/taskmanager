<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
    <div class="container-fluid px-4 py-3">
        <span class="navbar-brand fw-bold">📋 Task Manager</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="userEmail"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Cerrar Sesión</button>
        </div>
    </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-4">
    <div class="row">
        <div class="col-md-10 offset-md-1">

            <!-- HEADER CON BOTÓN CREAR -->
            <div class="card mb-4">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h3 class="mb-0">Mis Tareas</h3>
                        <p class="text-muted mb-0">Gestiona tus tareas pendientes</p>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                        ➕ Nueva Tarea
                    </button>
                </div>
            </div>

            <!-- LISTA DE TAREAS -->
            <div id="tasksContainer">
                <!-- Las tareas se cargan aquí dinámicamente -->
            </div>

            <!-- MENSAJE SI NO HAY TAREAS -->
            <div id="emptyState" class="card text-center py-5 d-none">
                <div class="card-body">
                    <h4 class="text-muted">📝 No tienes tareas aún</h4>
                    <p class="text-muted">Crea tu primera tarea para comenzar</p>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- MODAL: CREAR TAREA -->
<div class="modal fade" id="createTaskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">➕ Nueva Tarea</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createTaskForm">
                    <div class="mb-3">
                        <label class="form-label">Título *</label>
                        <input type="text" class="form-control" id="taskTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" id="taskDescription" rows="3"></textarea>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="taskCompleted">
                        <label class="form-check-label" for="taskCompleted">
                            Marcar como completada
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="saveTaskBtn">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
